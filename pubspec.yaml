name: camera_ai_pro
description: Professional camera app with AI assistants
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Camera & Image Processing
  camera: ^0.11.0+2
  camerawesome: ^2.5.0
  image: ^4.1.3
  
  # ML Kit (On-device AI)
  google_mlkit_face_detection: ^0.11.0
  google_mlkit_image_labeling: ^0.12.0
  google_mlkit_object_detection: ^0.13.0
  google_mlkit_document_scanner: ^0.2.0
  
  # State Management & DI
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  get_it: ^7.6.4
  
  # Storage & Files
  path_provider: ^2.1.1
  permission_handler: ^11.1.0
  saver_gallery: ^3.0.3
  
  # Utilities
  device_info_plus: ^9.1.1
  share_plus: ^7.2.1
  pdf: ^3.10.7
  printing: ^5.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/

name: camera_ai_app
description: App de cámara con IA - 4 modos profesionales
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # Cámara
  camera: ^0.11.0+2
  camerawesome: ^2.0.0+1
  
  # IA On-Device
  google_mlkit_face_detection: ^0.11.0
  google_mlkit_image_labeling: ^0.12.0
  google_mlkit_object_detection: ^0.13.0
  google_mlkit_document_scanner: ^0.2.0
  
  # Almacenamiento
  path_provider: ^2.1.1
  permission_handler: ^11.1.0
  saver_gallery: ^3.0.3
  device_info_plus: ^9.1.1
  
  # Compartir y PDF
  share_plus: ^7.2.1
  pdf: ^3.10.7
  printing: ^5.12.0
  
  # Procesamiento de imagen
  image: ^4.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
